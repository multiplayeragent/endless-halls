<script type="module">
/* ═══ ENDLESS HALLS · a Multiplayer Agent starter ══════════════════════════════════════
 * Yellow wallpaper, damp carpet, humming lights, and no way out. Find the keys on each
 * level, then the EXIT. Something wanders the halls: you hear it before you see it.
 * Stay close to your friends: alone, the static grows, and it comes for whoever is most
 * afraid. Co-op, 1–4 players; bot explorers fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ speeds, dread, the entity's senses, timers, the size of the halls
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   HALLS ......... the endless layout: every wall comes from hash(seed, cell), so everyone
 *                   builds the same halls from one seed. Routes (for bots and the entity),
 *                   line of sight, wall collisions.
 *   SCENE ......... wallpaper, carpet, ceiling tiles and fluorescent panels, rebuilt around
 *                   the camera as you walk; keys, the exit door, particles
 *   PEOPLE ........ explorer models and the entity
 *   RUN (HOST) .... phases (brief, explore, clear, over), keys, the exit, the entity and the
 *                   bot explorers. Only the host writes these.
 *   ME ............ walking, looking, dread, picking up keys. Each player writes only its own.
 *   HUD & RESULTS . level, keys, lights, compass, team dread, results card, leaderboard
 *   INPUT & SOUND . keyboard, mouse look, touch stick, WebAudio hum, chimes and footsteps
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: position, facing,
 *     dread, running, which level it is on) about 12 times a second, `hb` (heartbeat)
 *     once a second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, v, phase,
 *     level, seed, timers, the keys and who found them, the exit, the team's lights, who
 *     was taken), `ent` (the entity) and `bots`. A new host adopts all three and carries on.
 *   - Intents to the host: "take" {i} (pick up key i; the host checks you are next to it)
 *     and "again" (skip the results wait). Using the exit and getting taken are decided by
 *     the host from everyone's positions. The host can't move you, so when the entity takes
 *     you it bumps game.tp[yourId]; your own browser sees that and walks you back to the start.
 *   - The halls come from game.seed (same seed = same halls). A new level starts when the
 *     host writes a new level number; a new run when it bumps game.id.
 *   - ?attract plays offline with bots only, lights up (the preview video is recorded from it).
 *   - Leaderboard "deepest-level": the deepest level each player reached.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  briefMs: 3500,          // ms of "Level N" before the level starts
  clearMs: 3500,          // ms of "level cleared" before the next one
  resultsMs: 12000,       // ms the results show before a new run
  walk: 3.8, run: 5.8,    // your speeds, units/s
  botWalk: 3.4, botRun: 5.3, // bot explorers: a bit slower
  radius: 0.3,            // how wide a person is, for walls
  reach: 1.7,             // how close you get to pick up a key or use the exit
  closeRange: 7,          // a teammate this close counts as company
  dread: { alone: 7, near: 22, calm: 25 }, // per second: + when alone, + when the entity is within 12, − with company
  hearRange: 34,          // how far you hear the entity and the keys' chime
  // The entity: speeds (units/s, + perLevel each level), how far it sees, catch distance, ms it sleeps at the
  // start of a level, ms it keeps chasing what it lost, ms it is gone after taking someone.
  ent: { wander: 1.8, stalk: 2.9, chase: 4.4, perLevel: 0.12, sight: 14, catch: 1.0, sleepMs: 8000, giveUpMs: 3000, goneMs: 6000 },
  safeMs: 4000,           // ms someone it just took can't be taken again
  keyDist: [10, 26],      // keys sit this many steps (lattice cells) from the start
  exitDist: [26, 40],     // the exit this many steps away
  lightChance: 0.55,      // share of rooms with a ceiling light (fewer on deeper levels)
  board: "deepest-level",
  attractSeed: 1,         // which run ?attract replays (?attract=N tries another)
  // The halls are a lattice: P = one room plus one wall (units), W = wall thickness, H = ceiling height.
  P: 4.5, W: 0.5, H: 3.0,
  view: 8,                // periods around you that are built (the fog hides the edge)
};
const BOT_NAMES = ["Wren", "Milo", "Ash", "Juniper", "Theo", "Sable"];
const COLORS = ["#ff6b5a", "#4da6ff", "#7be07b", "#c58cff", "#ffb547", "#ff7ac8"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'endless-halls',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',

const QS = new URLSearchParams(location.search), ATTRACT = QS.has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

    sessionId: id, state, offline: true,

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();

    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });

}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── HALLS ───────────────────────────────────────────────────────────────────────────
// Lattice cell (i, j): odd/odd = a room (always open), even/even = a pillar (always solid),
// odd/even or even/odd = a wall segment between two rooms, solid or open by hash(seed, i, j).
if (ATTRACT) { Object.assign(CONFIG, { briefMs: 200, clearMs: 1500, resultsMs: 2500, lightChance: 0.75 }); Object.assign(CONFIG.ent, { sleepMs: 1500, wander: 2.4, stalk: 2.6, goneMs: 2500 }); }
const { P, W, H } = CONFIG;
let SEED = 1; // the current level's seed (from game.seed)
function hash(a, b, c, d) { let h = Math.imul(a | 0, 0x9e3779b1) ^ Math.imul(b | 0, 0x85ebca77) ^ Math.imul(c | 0, 0xc2b2ae3d) ^ Math.imul(d | 0, 0x27d4eb2f); h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d); h = Math.imul(h ^ (h >>> 12), 0x297a2d39); h ^= h >>> 15; return (h >>> 0) / 4294967296; }

  if (!ei && !ej) return true;
  if (ei && ej) return false;
  if (Math.abs(i) <= 4 && Math.abs(j) <= 4) return true; // the room you start in
  const zone = hash(SEED, Math.floor(i / 12), Math.floor(j / 12), 7);
  if (zone < 0.14) return hash(SEED, i, j, 3) > 0.08;  // a big open hall of pillars
  const along = ej ? i : j, line = ej ? j : i, dense = zone > 0.8; // long walls with doorways; offices are denser

const toI = (x) => { const k = Math.floor(x / P); return 2 * k + (x - k * P < W ? 0 : 1); };
const centerOf = (i) => { const k = Math.floor(i / 2); return i & 1 ? k * P + W + (P - W) / 2 : k * P + W / 2; };

const roomCenter = (i, j) => ({ x: centerOf(i), z: centerOf(j) });
const SPAWN = roomCenter(1, 1);
const hasLight = (i, j) => hash(SEED, i, j, 9) < CONFIG.lightChance * Math.max(0.55, 1 - (level - 1) * 0.06);
const flickers = (i, j) => hash(SEED, i, j, 10) < 0.12;
let level = 1;
function dist(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

}
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
/** Steps (cells) from one cell to every reachable cell in a box around it: { at(i, j) → steps or -1 }. */
function stepsFrom(si, sj, pad) {

/** Walk an agent ({x, z, h, path}) along its path. False when it has nowhere to go. */

// ── SCENE ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });

const scene = new THREE.Scene();
const FOG = new THREE.Color("#3b3216");

const camera = new THREE.PerspectiveCamera(72, 1, 0.08, 120);

const panOf = (p) => { const dx = p.x - me.x, dz = p.z - me.z, d = Math.hypot(dx, dz) || 1; return (dx * -Math.cos(me.h) + dz * Math.sin(me.h)) / d; };

function soundscape(g, ent, dt, now) {

  const t = AC.currentTime;
  const ed = ent && ent.s !== "gone" && g.phase === "explore" ? dist(ent, me) : Infinity, near = Math.max(0, 1 - ed / CONFIG.hearRange);
  drone.g.gain.setTargetAtTime(near * near * 0.22, t, 0.2); drone.pan.pan.setTargetAtTime(ed < Infinity ? panOf(ent) * 0.8 : 0, t, 0.2);

  if (near > 0) { entStep += dt * (ent.s === "chase" ? 2.6 : 1.4); if (entStep > 1) { entStep = 0; tone(75, 0.3, "sine", 0.5 * near * near, 32, panOf(ent) * 0.8); } } // heavy steps, faster when it runs
  if (now > nextChime && g.phase === "explore") { // the nearest key you haven't found rings now and then

  }

}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
const staticCtx = $("static").getContext("2d"), staticImg = staticCtx.createImageData(160, 90);
function drawStatic(amount) {
  $("static").style.opacity = amount.toFixed(3);
  if (amount < 0.01) return;
  const d = staticImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  staticCtx.putImageData(staticImg, 0, 0);
}
let last = performance.now(), lastHb = 0, lastHud = 0, seedShown = -1, camYaw = 0;

  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.was = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: let the newer state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), t = now / 1000; last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  const g = game();
  if (!g) { renderer.render(scene, camera); return; }
  if (seedShown !== g.seed) { seedShown = g.seed; SEED = g.seed; level = g.level; builtAt = ""; ambient.intensity = (ATTRACT ? 1.45 : 1.25) * Math.max(0.6, 1 - (g.level - 1) * 0.05); lightScale = Math.max(0.6, 1 - (g.level - 1) * 0.05); }
  myTick(dt, g); effects(g);
  const all = people(g);
  // Everyone else, eased toward where they last said they were, then the bots.
  const seen = new Set(), live = new Set(livePlayers()), lk = lkOf(g);
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const q = id !== net.sessionId && live.has(id) && posOf(id, p);
    if (!q || q.k !== lk) continue;
    const v = viewOf(id, p.c || "#ccc", p.n || "Player"); seen.add(id); ease(v, q.x, q.z, q.h, dt); walkPose(v.g, t, !!q.m);
  }
  const hostBots = isHost() && host.was ? host.bots : null;
  for (const b of botList()) {
    const v = viewOf(b.i, b.c, b.n), live = hostBots && hostBots.get(b.i); seen.add(b.i);
    if (live) { v.x = live.x; v.z = live.z; v.h = live.h; v.fresh = false; v.g.position.set(v.x, 0, v.z); v.g.rotation.y = v.h; } else ease(v, b.x, b.z, b.h, dt); // the host draws its own simulation, not its 10/s snapshot

  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  if (!me.g) me.g = makePerson(myColor, "");
  me.g.visible = ATTRACT; me.g.position.set(me.x, 0, me.z); me.g.rotation.y = me.h; walkPose(me.g, t, me.mv);
  // The entity: drawn where the host says, a little jittery; not drawn while it's gone.
  const e = isHost() && host.was ? host.ent : shared("ent", null);
  let ev = null;
  if (e && e.s !== "gone" && g.phase !== "brief") {
    if (isHost() || entView.fresh || Math.hypot(e.x - entView.x, e.z - entView.z) > 8) Object.assign(entView, { x: e.x, z: e.z, h: e.h, fresh: false });
    else { const k = 1 - Math.pow(0.001, dt); entView.x += (e.x - entView.x) * k; entView.z += (e.z - entView.z) * k; entView.h += angDiff(e.h, entView.h) * k; }
    entity.visible = Math.random() > 0.04; entity.position.set(entView.x + (Math.random() - 0.5) * 0.04, Math.abs(Math.sin(t * 3)) * 0.05, entView.z); entity.rotation.y = entView.h;
    ev = { x: entView.x, z: entView.z, s: e.s };
  } else { entity.visible = false; entView.fresh = true; }
  // Keys and the exit.
  g.keys.forEach((k, i) => { const v = keyViews[i] || (keyViews[i] = makeKey()); v.visible = !k.b; v.position.set(k.x, 1.2 + Math.sin(t * 2 + i) * 0.1, k.z); v.rotation.y = t * 1.6 + i; });
  for (let i = g.keys.length; i < keyViews.length; i++) keyViews[i].visible = false;
  const open = g.keys.every((k) => k.b), X = exitGroup.userData;
  exitGroup.position.set(g.exit.x, 0, g.exit.z); exitGroup.rotation.y = g.exit.r;
  X.lamp.material.color.set(open ? "#3dff7a" : "#ff3b30"); X.door.rotation.y = THREE.MathUtils.lerp(X.door.rotation.y, open && g.phase === "clear" ? -1.4 : 0, 0.08); X.doorLight.intensity = open ? 6 + Math.sin(t * 4) : 2.5;
  for (let i = bits.length - 1; i >= 0; i--) {

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("take", (msg, from) => { if (isHost() && msg) applyTake(from, msg.i); });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "over") host.again = true; });
